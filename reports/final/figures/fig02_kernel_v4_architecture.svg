<rect x="0.0" y="0.0" width="1440.0" height="900.0" rx="0" fill="#10131A"/><text x="42.0" y="54.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">Kernel v4 的宿主程序控制型单智能体架构</text><text x="42.0" y="86.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="42.0" dy="0">模型负责理解任务并选择工具，随后组织答案；宿主程序负责权限控制和实际执行，并完成过程记录与上下文管理以及题后评分。</tspan></text><line x1="42.0" y1="118.0" x2="1398.0" y2="118.0" stroke="#3A4354" stroke-width="1"/><rect x="80.0" y="180.0" width="230.0" height="88.0" rx="18" fill="#171B24" stroke="#A3BEFA" stroke-width="1.2"/><rect x="80.0" y="180.0" width="9.0" height="88.0" rx="5" fill="#A3BEFA"/><text x="104.0" y="216.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">用户问题</text><text x="104.0" y="246.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="104.0" dy="0">题面给出公司和期间，并说明指标与约</tspan><tspan x="104.0" dy="19">束</tspan></text><rect x="380.0" y="180.0" width="260.0" height="88.0" rx="18" fill="#171B24" stroke="#FFE15B" stroke-width="1.2"/><rect x="380.0" y="180.0" width="9.0" height="88.0" rx="5" fill="#FFE15B"/><text x="404.0" y="216.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">无答案任务包</text><text x="404.0" y="246.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="404.0" dy="0">gold/reference</tspan><tspan x="404.0" dy="19">不进入上下文</tspan></text><rect x="735.0" y="160.0" width="310.0" height="128.0" rx="18" fill="#171B24" stroke="#F0986E" stroke-width="1.2"/><rect x="735.0" y="160.0" width="9.0" height="128.0" rx="5" fill="#F0986E"/><text x="759.0" y="196.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">单智能体循环</text><text x="759.0" y="226.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="759.0" dy="0">行动与观察反复推进，最后完成核验和收尾</tspan></text><rect x="1130.0" y="180.0" width="230.0" height="88.0" rx="18" fill="#171B24" stroke="#A3D576" stroke-width="1.2"/><rect x="1130.0" y="180.0" width="9.0" height="88.0" rx="5" fill="#A3D576"/><text x="1154.0" y="216.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">最终答案</text><text x="1154.0" y="246.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1154.0" dy="0">答案写明证据来源和公式，并给出数值</tspan><tspan x="1154.0" dy="19">与结论</tspan></text><rect x="125.0" y="390.0" width="280.0" height="95.0" rx="18" fill="#171B24" stroke="#5477C4" stroke-width="1.2"/><rect x="125.0" y="390.0" width="9.0" height="95.0" rx="5" fill="#5477C4"/><text x="149.0" y="426.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">模型服务适配</text><text x="149.0" y="456.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="149.0" dy="0">OpenAI-compatible /</tspan><tspan x="149.0" dy="19">DeepSeek</tspan></text><rect x="455.0" y="390.0" width="300.0" height="95.0" rx="18" fill="#171B24" stroke="#B8A037" stroke-width="1.2"/><rect x="455.0" y="390.0" width="9.0" height="95.0" rx="5" fill="#B8A037"/><text x="479.0" y="426.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">流式工具执行</text><text x="479.0" y="456.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="479.0" dy="0">工具调用生命周期实时记录</tspan></text><rect x="805.0" y="390.0" width="300.0" height="95.0" rx="18" fill="#171B24" stroke="#F390CA" stroke-width="1.2"/><rect x="805.0" y="390.0" width="9.0" height="95.0" rx="5" fill="#F390CA"/><text x="829.0" y="426.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">上下文与证据对象</text><text x="829.0" y="456.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="829.0" dy="0">长文档进入可检索对象</tspan></text><rect x="1130.0" y="390.0" width="230.0" height="95.0" rx="18" fill="#171B24" stroke="#CC6F47" stroke-width="1.2"/><rect x="1130.0" y="390.0" width="9.0" height="95.0" rx="5" fill="#CC6F47"/><text x="1154.0" y="426.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">运行事件</text><text x="1154.0" y="456.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1154.0" dy="0">事件记录支持监控和复盘，也生成图表</tspan><tspan x="1154.0" dy="19">数据</tspan></text><rect x="105.0" y="610.0" width="1170.0" height="155.0" rx="18" fill="#171B24" stroke="#71B436" stroke-width="1.2"/><rect x="105.0" y="610.0" width="9.0" height="155.0" rx="5" fill="#71B436"/><text x="129.0" y="646.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">工具注册表</text><text x="129.0" y="676.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="129.0" dy="0">工具面覆盖 SEC/EDGAR 与文档抽取，并通过证据对象读取支撑表格处理和计算器，也支撑日期工具与数值核验以及金融工具台</tspan></text><rect x="455.0" y="802.0" width="530.0" height="58.0" rx="18" fill="#171B24" stroke="#FFE15B" stroke-width="1.2"/><rect x="455.0" y="802.0" width="9.0" height="58.0" rx="5" fill="#FFE15B"/><text x="479.0" y="838.0" fill="#F4F7FB" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">题后评分</text><text x="479.0" y="868.0" fill="#AAB2C0" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="479.0" dy="0">gold/reference 只在此阶段用于 scoring；不进入模型上下文</tspan></text><path d="M 195.0 224.0 Q 352.5 224.0 510.0 224.0" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="510.0" cy="224.0" r="4.5" fill="#3A4354"/><path d="M 510.0 224.0 Q 700.0 224.0 890.0 224.0" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="890.0" cy="224.0" r="4.5" fill="#3A4354"/><path d="M 890.0 224.0 Q 1067.5 224.0 1245.0 224.0" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="1245.0" cy="224.0" r="4.5" fill="#3A4354"/><path d="M 890.0 224.0 Q 577.5 330.8 265.0 437.5" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="265.0" cy="437.5" r="4.5" fill="#3A4354"/><path d="M 890.0 224.0 Q 747.5 330.8 605.0 437.5" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="605.0" cy="437.5" r="4.5" fill="#3A4354"/><path d="M 605.0 437.5 Q 780.0 437.5 955.0 437.5" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="955.0" cy="437.5" r="4.5" fill="#3A4354"/><path d="M 955.0 437.5 Q 922.5 330.8 890.0 224.0" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="890.0" cy="224.0" r="4.5" fill="#3A4354"/><path d="M 605.0 437.5 Q 925.0 437.5 1245.0 437.5" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="1245.0" cy="437.5" r="4.5" fill="#3A4354"/><path d="M 605.0 437.5 Q 647.5 562.5 690.0 687.5" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="690.0" cy="687.5" r="4.5" fill="#3A4354"/><path d="M 690.0 687.5 Q 822.5 562.5 955.0 437.5" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="955.0" cy="437.5" r="4.5" fill="#3A4354"/><path d="M 1245.0 224.0 Q 982.5 527.5 720.0 831.0" fill="none" stroke="#3A4354" stroke-width="1.8"/><circle cx="720.0" cy="831.0" r="4.5" fill="#3A4354"/><text x="42.0" y="876.0" fill="#788397" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;DejaVu Sans&quot;, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">图示依据：kernel_v4/loop.py 与 providers.py，并结合 tooling.py 和 context.py 以及 finance_runner.py。</text>
